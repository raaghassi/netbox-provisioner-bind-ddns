[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-plugin-dns-bridge"
dynamic = ["version"]
description = "A bridge between netbox-plugin-dns and your DNS infrastructure with DDNS and IXFR support."
readme = "README.md"
requires-python = ">=3.10"
# netbox-plugin-dns is bounded to one minor line, not an open floor. The
# README pairing rule requires this plugin's major.minor to match it, and
# an open floor is what let an incompatible plugin install in 2026-10.
dependencies = ["netbox-plugin-dns>=1.7,<1.8", "dnspython>=2.8.0"]
license = { file = "LICENSE.md" }
authors = [{ name = "Sven Luethi", email = "dev@sven.luethi.co" }]

[project.optional-dependencies]
dev = ["django-stubs", "pyright"]

[project.urls]
Homepage = "https://github.com/Suraxius/netbox-plugin-dns-bridge"
Issues = "https://github.com/Suraxius/netbox-plugin-dns-bridge/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]

# Ship the NetBox UI detail templates in the wheel. include-package-data alone
# relies on a VCS file-finder that isn't guaranteed during a git+https wheel
# build, so declare them explicitly — otherwise the object detail views 500
# with TemplateDoesNotExist.
[tool.setuptools.package-data]
netbox_dns_bridge = ["templates/**/*.html"]

[tool.setuptools.dynamic]
version = { attr = "netbox_dns_bridge.__version__" }
